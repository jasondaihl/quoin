name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: open & update the "Version Packages" PR.
# packages: publish to GitHub Packages.
permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          # Writes an .npmrc pointing the @jasondaihl scope at GitHub Packages,
          # authenticated via NODE_AUTH_TOKEN (set on the release step below).
          registry-url: https://npm.pkg.github.com
          scope: "@jasondaihl"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # As changesets land on main, `version` opens/updates a "Version Packages"
      # PR (bumps versions + changelogs). When that PR is merged and no
      # changesets remain, `publish` runs the root `release` script
      # (`pnpm build && changeset publish`) to publish to GitHub Packages.
      - name: Version or publish
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        with:
          # version-packages runs `changeset version && biome format` — the
          # format step is required because `changeset version` rewrites
          # package.json in a style Biome would otherwise flag in CI. It must
          # be a single npm script: the action runs this command without a
          # shell, so a literal `&&` here would be passed as an argument.
          version: pnpm run version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
