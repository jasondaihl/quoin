name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: open & update the "Version Packages" PR.
# packages: publish to GitHub Packages.
permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          # Writes an .npmrc pointing the @jasondaihl scope at GitHub Packages,
          # authenticated via NODE_AUTH_TOKEN (set on the release step below).
          registry-url: https://npm.pkg.github.com
          scope: "@jasondaihl"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # As changesets land on main, `version` opens/updates a "Version Packages"
      # PR (bumps versions + changelogs). When that PR is merged and no
      # changesets remain, `publish` runs the root `release` script
      # (`pnpm build && changeset publish`) to publish to GitHub Packages.
      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # version-packages runs `changeset version && biome format` — the
          # format step is required because `changeset version` rewrites
          # package.json in a style Biome would otherwise flag in CI. It must
          # be a single npm script: the action runs this command without a
          # shell, so a literal `&&` here would be passed as an argument.
          version: pnpm run version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
