name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: open & update the "Version Packages" PR.
# packages: publish to GitHub Packages.
permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Mint a short-lived GitHub App installation token. Commits/PRs pushed with
      # it are attributed to the app and DO trigger CI on the Version PR (unlike
      # the default GITHUB_TOKEN, which never triggers further workflows). The app
      # is a bypass actor for main's required-signatures rule, so the (unsigned)
      # Version commit can be merged — the squash onto main is GitHub-signed
      # regardless, so main history stays verified. No PAT to expire or re-mint.
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          # Writes an .npmrc pointing the @jasondaihl scope at GitHub Packages,
          # authenticated via NODE_AUTH_TOKEN (set on the release step below).
          registry-url: https://npm.pkg.github.com
          scope: "@jasondaihl"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # As changesets land on main, `version` opens/updates a "Version Packages"
      # PR (bumps versions + changelogs). When that PR is merged and no
      # changesets remain, `publish` runs the root `release` script
      # (`pnpm build && changeset publish`) to publish to GitHub Packages.
      - name: Version or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # version-packages runs `changeset version && biome format` — the
          # format step is required because `changeset version` rewrites
          # package.json in a style Biome would otherwise flag in CI. It must
          # be a single npm script: the action runs this command without a
          # shell, so a literal `&&` here would be passed as an argument.
          version: pnpm run version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # App token so the Version PR triggers CI and is attributed to the app.
          # NODE_AUTH_TOKEN stays the default GITHUB_TOKEN — it carries the
          # packages:write scope needed to publish to GitHub Packages.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
