name: Release

on:
  push:
    branches: [main]

# Lets the Changesets action open and update the "Version Packages" PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Versioning only: as changesets land on main, this opens/updates a
      # "Version Packages" PR that bumps versions + writes changelogs. Merging
      # that PR does NOT publish anything — no `publish` input is set.
      #
      # TODO(publish): once the package scope matches an owner we control
      # (rename @quoin/* -> @jasondaihl/*, or move the repo into an org), turn
      # on publishing to GitHub Packages:
      #   1. add `packages: write` to permissions above
      #   2. add `publishConfig.registry: https://npm.pkg.github.com` to each
      #      publishable package.json (and set changeset access to "public")
      #   3. add the `publish:` input below and an .npmrc auth step, e.g.
      #        publish: pnpm release
      - name: Create Version PR
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        with:
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
