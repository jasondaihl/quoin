name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: open & update the "Version Packages" PR.
# packages: publish to GitHub Packages.
permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional secrets that smooth out the Version-PR flow (see below). Both
      # fall back gracefully: without RELEASE_TOKEN the default GITHUB_TOKEN is
      # used; without SSH_SIGNING_KEY the version commit is simply unsigned.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Use a PAT when available so the Version PR's commits are pushed by a
          # real user — that makes CI run on the PR (the default GITHUB_TOKEN
          # does not trigger further workflows) and attributes the commits.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          # Writes an .npmrc pointing the @jasondaihl scope at GitHub Packages,
          # authenticated via NODE_AUTH_TOKEN (set on the release step below).
          registry-url: https://npm.pkg.github.com
          scope: "@jasondaihl"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sign the version commit with SSH so it satisfies main's required-
      # signatures rule and merges without manual intervention. Skipped when the
      # secret isn't set. The public half of this key must be registered as a
      # *signing key* on the committer's GitHub account, and the email below
      # must be a verified account email, for GitHub to mark it "Verified".
      - name: Configure commit signing
        if: ${{ env.SSH_SIGNING_KEY != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config user.name "Jason Daihl"
          git config user.email "jason@daihl.com"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key
          git config commit.gpgsign true

      # As changesets land on main, `version` opens/updates a "Version Packages"
      # PR (bumps versions + changelogs). When that PR is merged and no
      # changesets remain, `publish` runs the root `release` script
      # (`pnpm build && changeset publish`) to publish to GitHub Packages.
      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # version-packages runs `changeset version && biome format` — the
          # format step is required because `changeset version` rewrites
          # package.json in a style Biome would otherwise flag in CI. It must
          # be a single npm script: the action runs this command without a
          # shell, so a literal `&&` here would be passed as an argument.
          version: pnpm run version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # PAT (if set) so the PR/commits trigger CI and are attributed; falls
          # back to GITHUB_TOKEN. NODE_AUTH_TOKEN stays GITHUB_TOKEN — it has the
          # packages:write scope needed to publish to GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
