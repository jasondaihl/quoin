name: Eval

# Runs the MCP-server eval on demand and nightly. It does NOT gate `main` — the
# `verify` job in ci.yml stays the required check. This surfaces the quality score
# (and any regression vs. evals/baseline.json) as a visible, artifact-backed signal.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # nightly, 07:00 UTC

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the deterministic heuristic agent (no API key needed). `pnpm eval` builds
      # the MCP server + its token/component deps first, then grades against the real
      # server over stdio, exiting non-zero if the score drops below EVAL_MIN_SCORE.
      - name: Run eval (heuristic agent)
        run: pnpm eval

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: evals/results.json
          if-no-files-found: warn
