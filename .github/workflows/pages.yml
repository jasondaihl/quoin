name: Deploy Storybook to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-flight run finish rather than
# cancelling it, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build every package: the React Storybook imports @jasondaihl/tokens' CSS and
      # resolves @jasondaihl/core from its built dist, so both must exist first.
      - name: Build packages
        run: pnpm build

      - name: Build Core Storybook
        run: pnpm --filter @jasondaihl/core build-storybook

      - name: Build React Storybook
        run: pnpm --filter @jasondaihl/react build-storybook

      # Assemble a single site: a landing page at the root linking the two
      # explorers, each served from its own subpath.
      - name: Assemble site
        run: |
          mkdir -p _site/core _site/react
          cp -r packages/core/storybook-static/. _site/core/
          cp -r packages/react/storybook-static/. _site/react/
          cp .github/pages/index.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
